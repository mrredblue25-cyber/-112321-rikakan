<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユーザー画面</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div>
        <strong id="numberLabel">現在の番号：</strong>
          <div id="centerd">
             <span id="numberDisplay">まだ入力されていません</span>
          </div>
    </div>
    <a href="administrator.html">管理者画面はこちら</a>
      <script>
        const numberDisplay = document.getElementById('numberDisplay');

        // 他のタブでLocalStorageが更新されたときに動くイベント
        window.addEventListener('storage', function(event) {
            // 'sharedNumber' というキーが更新されたときだけ処理する
            if (event.key === 'sharedNumber') {
                const newValue = event.newValue;
                
                if (newValue === '') {
                    numberDisplay.textContent = 'まだ入力されていません';
                } else {
                    numberDisplay.textContent = newValue;
                }
            }
        });

          const initialValue = localStorage.getItem('sharedNumber');
        if (initialValue) {
            numberDisplay.textContent = initialValue;
        }
      </script>
</body>
</html>
